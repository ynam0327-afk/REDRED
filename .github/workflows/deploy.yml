name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > mocac.pem
          chmod 600 mocac.pem

      - name: Transfer ML files
        run: |
          scp -o StrictHostKeyChecking=no \
          -i mocac.pem \
          -r ml/* \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/REDRED-main/ml/

      - name: Restart backend
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i mocac.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

            cd /home/ec2-user/REDRED-main/backend

            docker compose restart notification-service

          ENDSSH
