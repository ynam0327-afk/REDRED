name: Deploy to AWS EC2

on:
  push:
    branches: [ main ] # main 브랜치에 코드가 푸시될 때 자동 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      # 1. 프론트엔드 빌드 (프론트엔드 변경사항이 있을 경우)
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # 2. EC2 접속용 SSH 키 세팅
      - name: Set up SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > mocac.pem
          chmod 600 mocac.pem

      # 3. 빌드된 프론트엔드 및 백엔드(ml 등) 파일을 EC2로 전송
      - name: Transfer files to EC2
        run: |
          # 프론트엔드 dist 파일을 EC2의 임시 폴더로 전송
          scp -o StrictHostKeyChecking=no -i mocac.pem -r frontend/dist/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/dist-new/
          
          # 수정하신 smishing_pipeline.py 등 ml 파일들을 EC2의 해당 경로로 전송
          scp -o StrictHostKeyChecking=no -i mocac.pem -r ml/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/REDRED-main/ml/

      # 4. EC2에 원격 접속해서 Nginx 웹서버 폴더 교체
      - name: Run deploy scripts on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i mocac.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /home/ec2-user/dist-new/* /usr/share/nginx/html/
          ENDSSH
